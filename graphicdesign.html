<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graphic Design Portfolio</title>
  <style>
    body {
      background-color: #070712;
      color: #ffffff;
      font-family: 'Inter', Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #ff3cac;
      font-size: 32px;
    }

    /* Grid Layout */
    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Card & Image Styling */
    .image-card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      cursor: pointer;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .image-card img:hover {
      transform: translateY(-5px);
      border-color: #ff3cac;
    }

    /* Fullscreen Lightbox Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
    }

    .modal img {
      max-width: 90%;
      max-height: 85vh;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: #fff;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>🎨 Graphic Design Showcase</h1>

  <div class="image-grid">
    <div class="image-card">
      <img src="calender big copy.jpg.jpeg" alt="Graphic Design 1" onclick="openModal(this)">
    </div>
    <div class="image-card">
      <img src="calender mini copy.jpg.jpeg" alt="Graphic Design 2" onclick="openModal(this)">
    </div>
    <div class="image-card">
      <img src="zmb copy.jpg.jpeg" alt="Graphic Design 3" onclick="openModal(this)">
    </div>
    <div class="image-card">
      <img src="00 copy.jpg.jpeg" alt="Graphic Design 4" onclick="openModal(this)">
    </div>
    <div class="image-card">
      <img src="Cer 2.jpg.jpeg" alt="Graphic Design 5" onclick="openModal(this)">
    </div>
    <div class="image-card">
      <img src="CER.jpg.jpeg" alt="Graphic Design 6" onclick="openModal(this)">
    </div>
  </div>

  <!-- Fullscreen Modal Container -->
  <div id="imageModal" class="modal" onclick="closeModal()">
    <span class="modal-close">&times;</span>
    <img id="modalImg" src="">
  </div>

  <script>
    function openModal(element) {
      document.getElementById("imageModal").style.display = "flex";
      document.getElementById("modalImg").src = element.src;
    }

    function closeModal() {
      document.getElementById("imageModal").style.display = "none";
    }
  </script>

</body>
</html>
