<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Video Creation</title>
  <style>
    body {
      background-color: #070712;
      color: #ffffff;
      font-family: 'Inter', Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #ff3cac;
      font-size: 32px;
    }

    /* Grid Layout */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 25px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Card & Video Styling */
    .video-card {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 15px;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .video-card:hover {
      transform: translateY(-5px);
      border-color: #ff3cac;
    }

    video {
      width: 100%;
      height: 220px;
      border-radius: 12px;
      outline: none;
      background: #000;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <h1>🤖 AI Video Creation Showcase</h1>

  <div class="video-grid">
    <div class="video-card">
      <video controls>
        <source src="watermark-removed-15-second_continuous_drone_follow,_starts_202607031734.mp4" type="video/mp4">
        Apnar browser video support kare na.
      </video>
    </div>

    <div class="video-card">
      <video controls>
        <source src="Driver_entering_and_racing_car_202608160008.mp4" type="video/mp4">
        Apnar browser video support kare na.
      </video>
    </div>
  </div>

</body>
</html>
