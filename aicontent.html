<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Audio & Showcase Gallery</title>
  <style>
    body {
      background-color: #070712;
      color: #ffffff;
      font-family: 'Inter', Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
    }

    h1, h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 { color: #ff3cac; }
    h2 { color: #00f2fe; border-bottom: 2px solid rgba(255,255,255,0.1); padding-bottom: 10px; margin-top: 50px; }

    /* Layout Grids */
    .audio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto 50px auto;
    }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Cards */
    .audio-card {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 15px;
      padding: 20px;
      text-align: center;
    }

    .image-card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: transform 0.3s ease;
    }

    .image-card img:hover {
      transform: translateY(-5px);
    }

    audio {
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>
<body>
