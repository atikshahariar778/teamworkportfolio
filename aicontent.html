<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Content - Audio & Image Gallery</title>
  <style>
    body {
      background-color: #070712;
      color: #ffffff;
      font-family: 'Inter', Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
    }

    h1, h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 { color: #ff3cac; }
    h2 { 
      color: #00f2fe; 
      border-bottom: 2px solid rgba(255,255,255,0.1); 
      padding-bottom: 10px; 
      margin-top: 50px; 
    }

    /* Grids */
    .audio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto 50px auto;
    }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Cards */
    .audio-card {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 15px;
      padding: 20px;
      text-align: center;
    }

    .image-card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      cursor: pointer; /* Pointer icon ashbe */
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .image-card img:hover {
      transform: translateY(-5px);
      border-color: #ff3cac;
    }

    audio {
      width: 100%;
      margin-top: 10px;
    }

    /* Fullscreen Modal (Facebook Style Pop-up) */
    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
    }

    .modal img {
      max-width: 90%;
      max-height: 85vh;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: #fff;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>AI Content & Portfolio</h1>

  <!-- Modal Container -->

  <script>
    function openModal(element) {
      document.getElementById("imageModal").style.display = "flex";
      document.getElementById("modalImg").src = element.src;
    }

    function closeModal() {
      document.getElementById("imageModal").style.display = "none";
    }
  </script>
